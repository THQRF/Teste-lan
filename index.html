<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MooLike.io P2P Ultimate</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;overflow:hidden}
#ui{position:fixed;top:0;left:0;width:100%;background:#111;padding:4px;text-align:center;z-index:10}
canvas{background:#2ecc71;display:block;margin-top:42px}
#chat{position:fixed;bottom:0;left:0;width:100%;background:#111;padding:4px}
#chatlog{max-height:120px;overflow-y:auto;font-size:12px;text-align:left}
button,input{padding:4px;margin:2px}
.touch{position:fixed;bottom:80px;left:20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.1)}
</style>
</head>
<body>
<div id="ui">
<button onclick="createRoom()">Criar Sala</button>
<input id="room" placeholder="ID da sala">
<button onclick="joinRoom()">Entrar</button>
<span id="status"></span>
</div>
<canvas id="game" width="1000" height="520"></canvas>
<div id="chat">
<div id="chatlog"></div>
<input id="chatmsg" placeholder="Digite e Enter" onkeydown="if(event.key==='Enter')sendChat()">
</div>
<div class="touch" id="touch"></div>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
/* ====== CORE ====== */
const c=document.getElementById('game'),ctx=c.getContext('2d');
let peer,conns={},isHost=false,myId;
let players={},resources=[],structures=[],bots=[];
const keys={},speed=2.5;
let chatlog=document.getElementById('chatlog');addEventListener('keydown',e=>keys[e.key]=1); addEventListener('keyup',e=>keys[e.key]=0);

function createRoom(){isHost=true;peer=new Peer();peer.on('open',id=>{myId=id;players[id]=newPlayer(500,260);spawnWorld();status('Sala: '+id)}); peer.on('connection',c=>{conns[c.peer]=c;players[c.peer]=newPlayer(rand(60,940),rand(60,460));c.on('data',d=>handleData(c.peer,d))})}

function joinRoom(){peer=new Peer();peer.on('open',id=>{myId=id;const c=peer.connect(document.getElementById('room').value);conns[c.peer]=c;c.on('data',d=>handleData(null,d));status('Conectado')})}

function handleData(pid,d){if(d.type==='input'&&isHost)applyInput(players[pid],d); if(d.type==='state'&&!isHost){players=d.players;resources=d.resources;structures=d.structures;bots=d.bots} if(d.type==='chat')addChat(d.msg)}

/* ====== PLAYER ====== */ function newPlayer(x,y){return{x,y,hp:100,wood:0,food:0,weapon:'spear',skin:randColor(),inv:[]}}

/* ====== WORLD ====== */ function spawnWorld(){for(let i=0;i<15;i++)resources.push({x:rand(40,960),y:rand(40,480),type:'tree',hp:40}); for(let i=0;i<6;i++)resources.push({x:rand(40,960),y:rand(40,480),type:'food',hp:1}); for(let i=0;i<3;i++)bots.push({x:rand(80,920),y:rand(80,440),hp:60})}

/* ====== INPUT ====== */ function applyInput(p,d){p.x+=d.dx;p.y+=d.dy}

/* ====== UPDATE ====== */ function update(){let dx=0,dy=0;if(keys.w)dy-=speed;if(keys.s)dy+=speed;if(keys.a)dx-=speed;if(keys.d)dx+=speed; if(keys['1'])players[myId].weapon='spear'; if(keys['2'])players[myId].weapon='sword'; if(isHost){applyInput(players[myId],{dx,dy});logic(players[myId]);botsAI();broadcast({type:'state',players,resources,structures,bots})} else send({type:'input',dx,dy})}

/* ====== LOGIC ====== */ function logic(p){resources.forEach(r=>{if(dist(p,r)<20&&r.hp>0){if(r.type==='tree'){r.hp--;p.wood++}if(r.type==='food'){r.hp=0;p.hp=Math.min(100,p.hp+15)}}}); structures.forEach(s=>{if(dist(p,s)<20&&s.type==='mill')p.food++}); }

/* ====== COMBAT ====== */ function attack(p){let range=p.weapon==='spear'?40:25;let dmg=p.weapon==='spear'?6:10; bots.forEach(b=>{if(dist(p,b)<range){b.hp-=dmg;playSound()}})}

/* ====== BOTS ====== */ function botsAI(){bots.forEach(b=>{let t=players[Object.keys(players)[0]];if(!t)return; let a=Math.atan2(t.y-b.y,t.x-b.x);b.x+=Math.cos(a)*1.2;b.y+=Math.sin(a)*1.2;if(dist(b,t)<20)t.hp-=0.3})}

/* ====== BUILD ====== */ function build(type){let p=players[myId];if(p.wood<10)return;p.wood-=10;structures.push({x:p.x+30,y:p.y,type})}

/* ====== DRAW ====== */ function draw(){ctx.clearRect(0,0,c.width,c.height); // minimap ctx.fillStyle='#000';ctx.fillRect(840,10,150,90); for(let id in players){let p=players[id];ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(p.x,p.y,14,0,6.28);ctx.fill();ctx.fillText('❤'+Math.floor(p.hp),p.x-14,p.y-18); ctx.fillRect(840+p.x/10,10+p.y/10,3,3)} resources.forEach(r=>{ctx.fillStyle=r.type==='tree'?'#145a32':'#f1c40f';ctx.beginPath();ctx.arc(r.x,r.y,10,0,6.28);ctx.fill()}); structures.forEach(s=>{ctx.fillStyle='#7f8c8d';ctx.fillRect(s.x-10,s.y-10,20,20)}); bots.forEach(b=>{ctx.fillStyle='#9b59b6';ctx.beginPath();ctx.arc(b.x,b.y,13,0,6.28);ctx.fill()})}

/* ====== CHAT ====== */ function sendChat(){let v=document.getElementById('chatmsg').value;if(!v)return;document.getElementById('chatmsg').value='';broadcast({type:'chat',msg:myId+': '+v});addChat(myId+': '+v)} function addChat(t){chatlog.innerHTML+=t+'<br>';chatlog.scrollTop=9999}

/* ====== NET ====== */ function send(d){Object.values(conns).forEach(c=>c.send(d))} function broadcast(d){Object.values(conns).forEach(c=>c.send(d))}

/* ====== UTILS ====== / function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)} function rand(a,b){return Math.random()(b-a)+a} function randColor(){return hsl(${Math.random()*360},70%,60%)} function status(t){document.getElementById('status').innerText=t}

/* ====== SOUND ====== */ let audio=new Audio('https://actions.google.com/sounds/v1/impacts/wood_plank_flicks.ogg'); function playSound(){audio.currentTime=0;audio.play()}

/* ====== LOOP ====== */ setInterval(()=>{update();draw()},1000/60); </script>

</body>
</html>
